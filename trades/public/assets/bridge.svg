<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bridge-water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#81d4fa"/>
      <stop offset="100%" stop-color="#0288d1"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="32" height="32" fill="#ffffff"/>
  <rect x="1" y="1" width="30" height="30" rx="5" ry="5" fill="none" stroke="#1e1e1e" stroke-width="2"/>
  <!-- + shape: water (blue) horizontal strip -->
  <rect x="4" y="13" width="24" height="6" fill="url(#bridge-water)" stroke="#01579b" stroke-width="0.5"/>
  <!-- Bridge (black) vertical strip on top -->
  <rect x="13" y="4" width="6" height="24" fill="#1e1e1e" stroke="#37474f" stroke-width="0.5"/>
</svg>
